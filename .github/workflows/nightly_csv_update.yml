name: Nightly CSV Data Update

on:
  schedule:
    # Runs at 21:00 UTC every day (which is 2:30 AM IST)
    - cron: '0 21 * * *'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend_v2/requirements.txt

      - name: Run CSV Updater Script
        run: |
          cd backend_v2
          python update_all_csvs.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend_v2/data/
          git commit -m "Auto-update intraday market CSVs [skip ci]" || echo "No new data to commit"
          git push
